<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>4Finance Lab | Financial Analysis Lab by Perry Gogas</title>
  <meta name="description" content="4Finance Lab: interactive financial analysis tools for teaching and practice. Bankruptcy prediction, bond pricing and duration, futures, options, VaR, NPV/IRR, loans and portfolio theory. By Prof. Periklis Gogas.">
  <meta name="author" content="Prof. Periklis Gogas">
  <meta name="theme-color" content="#0f2742">

  <!-- Social preview -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="4Finance Lab | Financial Analysis Lab">
  <meta property="og:description" content="Interactive financial analysis tools with step-by-step formulas, interactive charts and Excel/PNG export. By Prof. Periklis Gogas.">
    <meta property="og:image" content="https://perrygogas.github.io/4FinanceLab/icons/thumbnail.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://perrygogas.github.io/4FinanceLab/icons/thumbnail.png">

  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="stylesheet" href="css/styles.css?v=2.1.0">
  <script>
    // apply saved theme before paint
    (function () {
      var t = null;
      try { t = localStorage.getItem('4fl-theme'); } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="Tools menu">
    <a class="brand" href="#home">
      <img src="icons/icon.svg" alt="">
      <span><b>4Finance Lab</b><small>Financial Analysis Suite</small></span>
    </a>
    <nav id="nav"></nav>
    <div class="side-foot">Prof. Periklis Gogas<br>v2.0 &middot; for teaching use</div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="crumb" id="crumb">Home</div>
      <div class="lab-badge" title="EMEF Lab, Prof. Periklis Gogas"><span class="emef"><b>E</b><b>M</b><b>E</b><b>F</b><span>Lab</span></span><span class="who">Professor Periklis Gogas</span></div>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle dark mode"></button>
    </header>

    <main class="content" id="content"></main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="lib/chart.umd.min.js"></script>
<script src="lib/xlsx.mini.min.js"></script>
<script src="js/math.js?v=2.1.0"></script>
<script src="js/tools.js?v=2.1.0"></script>
<script src="js/app.js?v=2.1.0"></script>
</body>
</html>
